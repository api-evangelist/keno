aid: keno
name: Keno
description: Keno is an on-demand, doorstep car-wash and vehicle-care mobile application
  operating in the United Arab Emirates, billing itself as the "No.1 car wash app in the
  UAE". Customers download the iOS or Android app, add their vehicle, select from wash,
  maintenance, and detailing services (priced by vehicle class from bike to luxury SUV),
  and a mobile team of "ninjas" arrives at the customer's location to perform the work
  with a choice of payment methods. Keno is a 500 Global portfolio company. It is a
  consumer mobile application with no public developer API, OpenAPI, SDK, CLI, or
  developer portal; this profile captures its public identity and domain-security posture
  for the API Evangelist network.
